<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | EquationLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-nav">
<nav class="navbar navbar-expand-lg container py-3">
  <a class="brand" href="index.html"><span class="sigma">&sum;</span>EquationLens</a>
  <button class="navbar-toggler border-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav mx-auto gap-lg-3">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li> <li class="nav-item"><a class="nav-link" href="index.html#method">Method</a></li> <li class="nav-item"><a class="nav-link" href="index.html#stack">Stack</a></li>
    </ul>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-yale" href="login.html">Log in</a>
      <a class="btn btn-yale" href="signup.html">Sign up</a>
    </div>
  </div>
</nav>
</header>

<main class="container py-5">
  <div class="row g-0 sheet overflow-hidden">
    <div class="col-lg-5 auth-side d-flex flex-column justify-content-between">
      <div>
        <h2 class="display-6 mb-3">Welcome back.</h2>
        <p class="mb-4">Pick up where you left off. Your recent equations are waiting.</p>
      </div>
      <figure class="mb-0">
        <img class="eq-img" src="images/eq-linear.png" alt="Handwritten equation: 3x plus 7 equals 22">
        <figcaption class="fig-cap mt-2" style="color:var(--dust)">x = 5</figcaption>
      </figure>
    </div>
    <div class="col-lg-7 sheet-pad p-4 p-lg-5">
      <h1 class="h2 mb-4">Log in</h1>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="role">I am a</label>
          <select class="form-select" id="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" placeholder="you@example.com" required autocomplete="email">
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-group has-validation">
            <input class="form-control" id="password" type="password" required autocomplete="current-password">
            <button class="btn pw-toggle" type="button" data-toggle-password="#password">Show</button>
            <div class="invalid-feedback">Enter your password.</div>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Keep me logged in</label></div>
          <a href="#" class="small">Forgot password?</a>
        </div>
        <button class="btn btn-gold w-100" type="submit">Log in</button>
      </form>
      <p class="mt-4 mb-0 text-muted-coffee">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</main>
<footer class="container site-footer py-4 d-flex justify-content-between flex-wrap gap-2">
  <span>&copy; <span data-year>2026</span> EquationLens</span>
  <span><a href="login.html">Log in</a> &middot; <a href="signup.html">Sign up</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
